services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # MinIO 官方 2026-09-11 把 minio/minio 在 Docker Hub 上的仓库直接删掉了（不是限流
    # 也不是要登录——仓库本体不存在了，哪怕登录账号也拉不到，已实测复现），quay.io 的
    # 备份镜像也在同月底跟着失效；社区版从此只发源码，官方的说法是要用容器镜像就买
    # 商业版 AIStor。改用 cgr.dev/chainguard/minio——这是 Chainguard 维护的同一套
    # MinIO server 二进制的发行分支，多架构、不需要登录、持续在更新，命令行参数和原来
    # 的 minio/minio 完全兼容，不需要改任何应用代码。
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    # 产品诊断 #61：之前 minio 没有 healthcheck，backend 对它的 depends_on 只能用
    # service_started（"进程起了"），没法等它真的能响应请求——MinIO 官方自带的
    # /minio/health/live 探活端点，镜像里恰好带了 curl，直接用。
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: avatars
    # 产品诊断 #61：/api/health 现在会真实探测 DB/MinIO 连通性（见 HealthController），
    # 配上这个 healthcheck，Compose 才能感知到"进程活着但依赖没连上"这种假性健康的情况，
    # 而不是只看进程有没有在跑。镜像基于 eclipse-temurin:17-jre，自带 curl。
    # depends_on 从 service_started 升级成 service_healthy 之后（code review 提醒），
    # deploy.sh 的 `compose up -d` 在 backend 一直没转健康时会等到 retries 用完才报错
    # 退出，而不是像以前那样"进程起了就当完事"——这是故意的（宁可部署脚本显式失败，
    # 也不要悄悄跑着一个其实连不上库的 backend）。retries 给得比本地开发机实测需要的
    # 更宽松一些，是为了覆盖生产服务器在资源紧张时启动变慢的情况；如果真实部署中还是
    # 经常在这一步超时失败，调大 retries，不要退回 service_started。
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  minio_data:
