name: CI

# 产品诊断 #44：仓库此前没有任何 CI，300+ 后端测试、380+ 前端测试的价值完全靠
# "有没有人想起来手动跑"这个人工决定——这里只做最小可用的把关：PR 和合并到 main
# 时跑后端全量测试 + 前端类型检查和全量测试，不做部署，部署仍然是 deploy.sh 手动触发
# （见 DEPLOY.md）。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # GitHub 托管 runner 的 Docker Engine 版本升级之后，docker-java 启动探测硬编码
      # 发的第一个请求（固定打 /v1.32/）被拒绝（"client version 1.32 is too old,
      # minimum supported API version is 1.40"），跟本地 colima 那次是同一个根因（见
      # docs/architecture/技术架构.md「测试基建」一节和项目记忆
      # project_colima_testcontainers_incompatibility）。这里不需要本地那套
      # DOCKER_HOST/TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE（那是绕 colima 专属的 socket
      # 路径问题），标准 Docker socket 本来就在默认路径上；只需要让 docker-java 跳过
      # 那次过时的版本探测，固定用一个双方都支持的 API 版本。
      - name: Run backend tests
        working-directory: backend
        env:
          DOCKER_API_VERSION: "1.44"
          JAVA_TOOL_OPTIONS: "-Dapi.version=1.44"
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 11 要求 Node >=22.13；actions/setup-node 开了 cache: pnpm 时，会在自己
      # 切换 Node 版本之前先用 runner 当前默认的 Node 调一次 pnpm 来解析缓存路径——
      # 如果这里还配成 Node 20，那次提前调用会直接报 ERR_UNKNOWN_BUILTIN_MODULE
      # 崩掉（实测踩过），所以 node-version 必须先满足 pnpm 11 的要求。
      - uses: pnpm/action-setup@v6
        with:
          version: "11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: npx tsc -b

      - name: Run unit tests
        working-directory: frontend
        run: npx vitest run
