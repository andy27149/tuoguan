name: CI

# 产品诊断 #44：仓库此前没有任何 CI，300+ 后端测试、380+ 前端测试的价值完全靠
# "有没有人想起来手动跑"这个人工决定——这里只做最小可用的把关：PR 和合并到 main
# 时跑后端全量测试 + 前端类型检查和全量测试，不做部署，部署仍然是 deploy.sh 手动触发
# （见 DEPLOY.md）。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # GitHub-hosted runner 自带标准 Docker Engine，Testcontainers 不需要本地开发机
      # 那套 colima 专用环境变量（见 docs/architecture/技术架构.md「测试基建」一节），
      # 这里直接跑就行。
      - name: Run backend tests
        working-directory: backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: npx tsc -b

      - name: Run unit tests
        working-directory: frontend
        run: npx vitest run
