server:
  port: 8080

spring:
  application:
    name: tuoguan-backend
  datasource:
    # 数据库所有 DATETIME 列（如 generated_at）都是靠 MySQL 的 CURRENT_TIMESTAMP 写入的，
    # 而 CURRENT_TIMESTAMP 实际使用的是数据库会话时区（本机 MySQL 容器的会话时区是
    # SYSTEM，即跟随容器系统时区——目前是 UTC），写进去的是不带时区标记的 UTC 时刻数字。
    # 这里原来写死 serverTimezone=Asia/Shanghai，会让 JDBC 驱动把这些本来就是 UTC 的
    # 数字再错误地当成北京时间去转换，导致读出来的 Instant 整体多偏了 8 小时（账单"生成
    # 时间"显示错误、导出图片时间不对，根因都在这里，不是前端格式化的问题）。改成和数据库
    # 会话时区实际一致的 UTC，彻底消除这个双重转换。
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tuoguan}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USERNAME:tuoguan}
    password: ${DB_PASSWORD:tuoguan}
    hikari:
      # 默认 30 秒——数据库网络分区（不是直接拒绝连接那种能快速报错的故障，而是悄悄
      # 丢包的那种）时，每个等待获取连接的请求线程都要卡满 30 秒才失败，容易在故障期间
      # 把 Tomcat 工作线程占满。缩短到 5 秒：对真实流量下偶尔的连接池短暂繁忙依然够用，
      # 同时让 HealthController 的探测（以及所有业务请求）在数据库出问题时更快报错，
      # 而不是被默认值拖着卡住（code review 发现：/api/health 原来的"2秒超时"注释只
      # 覆盖了连接有效性 ping 那一步，不覆盖拿到连接本身这一步，实际上限是这里的配置值）。
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

security:
  jwt:
    secret: ${JWT_SECRET}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minio_admin}
  secret-key: ${MINIO_SECRET_KEY:minio_change_me}
  bucket: ${MINIO_BUCKET:avatars}
  startup-retry:
    # backend 启动时确认 bucket 存在这一步，生产环境实测过 MinIO/nginx 偶尔没那么快
    # 就绪（StorageService 里有完整背景）。做成可配置而不是写死：如果这个窗口比当前
    # 设的 10 次 × 3 秒 = 最长 30 秒还长，改环境变量就行，不用改代码重新构建镜像。
    max-attempts: ${MINIO_STARTUP_RETRY_MAX_ATTEMPTS:10}
    delay-millis: ${MINIO_STARTUP_RETRY_DELAY_MILLIS:3000}
